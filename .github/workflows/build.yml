name: Build installers

# Builds the Mac .dmg and the Windows installers (.exe and .msi) and puts them
# all in one draft release.
# Runs when you push a version tag (git tag v1.1.0 && git push --tags),
# or by hand from the Actions tab ("Run workflow").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # one .dmg that runs on both Apple Silicon and Intel Macs
            args: '--target universal-apple-darwin'
            files: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-latest
            rust-targets: ''
            args: ''
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # Tauri won't compile until the page it bundles exists.
      - name: Build the app page
        run: npm run page

      - name: Check the diary storage
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Mochi Diary v__VERSION__
          releaseBody: |
            **Windows:** download `Mochi Diary_x.x.x_x64-setup.exe` and run it. It installs just for you, so no admin password is needed. (The `.msi` is the same app for anyone who prefers it.) Windows 10 or 11.
            Because the app isn't signed yet, SmartScreen may say "Windows protected your PC": click **More info**, then **Run anyway**.

            **Mac:** download the `.dmg`, open it and drag Mochi Diary into Applications. It runs on Apple Silicon and Intel Macs (macOS 11 or later).
            The first launch shows a warning because the app isn't signed; see the README for the one-time step.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The installers are also attached to the run itself, for builds started by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-Diary-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
