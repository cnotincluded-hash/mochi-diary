}
function go(tab) { if (S.tab === tab) { $('#scroll').scrollTo({ top: 0, behavior: 'smooth' }); return; } S.tab = tab; render(); $('#scroll').scrollTop = 0; }

/* ================= events ================= */
const ACT = {
  close: () => { const L = topLayer(); if (!L) return; if (L.dataset.id === 'composer') composerClose(); else if (L.dataset.id !== 'welcome') closeLayer(L); },
  tab: el => go(el.dataset.tab),
  new: () => openComposer(null),
  you: () => openYou(),
  'open-entry': el => openReader(el.dataset.id),
  reread: (el, ev) => { ev.stopPropagation(); readWithMochi(el.dataset.id, true); },
  'add-examples': () => addExamples(),
  'clear-examples': () => clearExamples(),
  'make-cards': el => makeCards(!!el.dataset.force),
  'stop-cards': () => { if (S.cardsCtl) S.cardsCtl.abort(); },
  vote: el => {
    const c = S.meta.cards; const k = c && c.list[+el.dataset.i]; if (!k) return;
    const v = +el.dataset.v; k.vote = k.vote === v ? 0 : v; k.why2 = '';
    S.meta.feedback = S.meta.feedback.filter(f => f.t !== k.title);
    if (k.vote) S.meta.feedback.push({ t: k.title, type: k.type, vote: k.vote, at: Date.now() });
    S.meta.feedback = S.meta.feedback.slice(-40);
    persistMeta(); render();
    if (k.vote > 0) toast('Mochi will remember you liked this.');
  },
  why: el => {
    const c = S.meta.cards; const k = c && c.list[+el.dataset.i]; if (!k) return;
    k.why2 = el.dataset.w; const f = S.meta.feedback.find(x => x.t === k.title); if (f) f.why = el.dataset.w;
    persistMeta(); render(); toast('Thanks. Mochi will adjust.');
  },
  range: el => { S.range = el.dataset.r; render(); },
  metric: el => { S.openMetric = S.openMetric === el.dataset.m ? null : el.dataset.m; render(); },
  cal: el => { const [y, m] = S.calMonth.split('-').map(Number); const d = new Date(y, m - 1 + (+el.dataset.d), 1); S.calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); },
  'open-dive': el => openDive(el.dataset.id),
  'write-dive': el => writeReport(el.dataset.id, !!el.dataset.force),
  'stop-dive': el => { const c = S.repCtl[el.dataset.id]; if (c) c.abort(); },
  'rep-tab': el => { S.repTab = el.dataset.k; refreshDive(layerById('dive').dataset.dive); },
  tick: el => { const id = el.dataset.id, i = +el.dataset.i; const a = S.meta.acts[id] = (S.meta.acts[id] || []).slice(); a[i] = !a[i]; persistMeta(); refreshDive(id); if (a[i]) toast("Nice. Mochi's cheering you on."); },
  // composer
  'c-close': () => composerClose(),
  'c-mode': el => { C.mode = el.dataset.m; renderComposer(); saveDraftSoon(); },
  'c-step': el => { C.step = +el.dataset.i; renderComposer(); saveDraftSoon(); },
  'c-go': el => { C.step = clamp(C.step + (+el.dataset.d), 0, 4); renderComposer(); saveDraftSoon(); const ta = $('#c-ta'); if (ta && matchMedia('(hover:hover)').matches) ta.focus(); },
  'c-starter': el => insertStarter(el.dataset.t),
  'c-photo': () => $('#c-file').click(),
  'c-photo-rm': () => { C.photo = null; C.photoChanged = true; const L = layerById('composer'); if (L) $('.sh-head', L).innerHTML = composerHead(); renderComposer(); },
  'c-save': () => composerSave(),
  // reader
  'r-more': el => {
    const L = layerById('reader'); const e = L && byId(L.dataset.entry); if (!e) return;
    const items = [{ ic: 'edit', label: 'Edit entry', run: () => openComposer(e) }];
    if (aiOK() && e.status !== 'reading') items.push({ ic: 'refresh', label: 'Ask Mochi to read again', run: () => readWithMochi(e.id, true) });
    items.push({ ic: 'trash', label: 'Delete', danger: true, run: async () => {
      if (!await confirmBox({ title: 'Delete this day?', text: "This entry and its photo will be gone for good.", ok: 'Delete', danger: true, expr: 'sad' })) return;
      S.entries = S.entries.filter(x => x.id !== e.id);
      if (e.photo && e.photo.id) S.store.delMedia(e.photo.id, e.photo.n).catch(() => {});
      S.store.delEntry(e.id).catch(saveErr);
      closeLayer(layerById('reader')); render(); toast('Deleted.');
    } });
    menu(el, items);
  },
  'r-edit-snap': () => { const L = layerById('reader'); L.dataset.edit = '1'; refreshReader(); const t = $('#r-snap'); if (t) t.focus(); },
  'r-snap-cancel': () => { const L = layerById('reader'); L.dataset.edit = ''; refreshReader(); },
  'r-snap-save': () => { const L = layerById('reader'); const e = byId(L.dataset.entry); const v = $('#r-snap').value.trim(); if (e && e.ai && v) { e.ai.snapshot = v.slice(0, 1400); persistEntry(e); } L.dataset.edit = ''; refreshReader(); render(); toast('Snapshot saved.'); },
  rate: el => { const L = layerById('reader'); const e = byId(L.dataset.entry); if (!e) return; const v = +el.dataset.v; e.rating = e.rating === v ? 0 : v; persistEntry(e); refreshReader(); },
  'r-note-save': () => { const L = layerById('reader'); const e = byId(L.dataset.entry); if (!e) return; e.note = $('#r-note').value.trim().slice(0, 600); persistEntry(e); refreshReader(); toast('Note saved.'); },
  'r-note-read': () => { const L = layerById('reader'); const e = byId(L.dataset.entry); if (!e) return; e.note = $('#r-note').value.trim().slice(0, 600); e.rating = 0; persistEntry(e); readWithMochi(e.id, true); },
  // you
  tone: el => { S.meta.tone = el.dataset.t; persistMeta(); refreshYou(); },
  flavor: el => { S.meta.flavor = el.dataset.f; applyLook(); persistMeta(); refreshYou(); },
  theme: el => { S.meta.theme = el.dataset.t; applyLook(); persistMeta(); refreshYou(); },
  'lock-toggle': async () => {
    if (S.meta.pinHash) { if (!await confirmBox({ title: 'Turn off the passcode?', ok: 'Turn off', danger: true, expr: 'wow' })) return; S.meta.pinHash = null; persistMeta(); refreshYou(); toast('Passcode off.'); }
    else openPinSetup();
  },
  'lock-after': el => { S.meta.lockAfter = +el.dataset.v; persistMeta(); refreshYou(); },
  'reread-quick': async () => {
    closeLayer(layerById('you'));
    const list = S.entries.filter(e => !e.example && e.ai && e.ai.src === 'quick' && e.status !== 'reading').slice(0, 20);
    for (const e of list) { if (!aiOK()) break; await readWithMochi(e.id, false); }
  },
  'export-json': () => exportJSON(),
  'export-md': () => exportMD(),
  erase: () => eraseAll(),
  'show-folder': () => { if (TAURI) TAURI.core.invoke('show_diary_folder').catch(() => toast("Couldn't open the folder.")); },
  pin: el => pinPress(el.dataset.d),
  'pin-forgot': async () => {
    if (!await confirmBox({ title: 'Forgot your passcode?', text: 'The only way back in is to erase this diary and start fresh. Your days cannot be recovered.', ok: 'Erase and start fresh', danger: true, expr: 'sad' })) return;
    await S.store.clearAll().catch(saveErr);
    S.entries = []; S.reports = {}; S.meta = normalizeMeta({ flavor: S.meta.flavor, theme: S.meta.theme }); await persistMeta();
    $('#lock').hidden = true; render(); openWelcome();
  },
  'welcome-go': () => finishWelcome(false),
  'welcome-examples': () => finishWelcome(true)
};
function onClick(ev) {
  if (ev.target.id === 'c-date' && ev.target.showPicker) { try { ev.target.showPicker(); } catch {} return; }
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act; if (!a || !ACT[a]) return;
  if (el.tagName === 'A') return;
  ev.preventDefault();
  ACT[a](el, ev);
}
function onInput(ev) {
  const t = ev.target;
  if (t.id === 'c-ta' && C) {
    if (C.mode === 'guided') C.parts[t.dataset.part] = t.value; else C.text = t.value;
    grow(t); updateWC(); saveDraftSoon();
    if (C.mode === 'guided') { const b = $(`.stp[data-i="${C.step}"]`); if (b) b.classList.toggle('done', !!t.value.trim()); }
  } else if (t.id === 'y-name' || t.id === 'y-notes') {
    S.meta[t.id === 'y-name' ? 'name' : 'notes'] = t.value;
    clearTimeout(onInput.t); onInput.t = setTimeout(() => { persistMeta(); if (S.tab === 'diary') render(); }, 600);
  }
}
function onChange(ev) {
  const t = ev.target;
  if (t.id === 'c-date' && C) { if (t.value && t.value <= dayKey()) C.day = t.value; const L = layerById('composer'); if (L) $('.sh-head', L).innerHTML = composerHead(); saveDraftSoon(); }
  else if (t.id === 'c-file') composerPhoto(t.files && t.files[0]);
  else if (t.id === 'y-import') { if (t.files && t.files[0]) importJSON(t.files[0]); t.value = ''; }
}
function onKey(ev) {
  if (!$('#lock').hidden) {
    if (/^\d$/.test(ev.key)) { ev.preventDefault(); pinPress(ev.key); } else if (ev.key === 'Backspace') { ev.preventDefault(); pinPress('x'); }
    return;
  }
  const pinL = layerById('pin');
  if (pinL && (/^\d$/.test(ev.key) || ev.key === 'Backspace')) { ev.preventDefault(); pinPress(ev.key === 'Backspace' ? 'x' : ev.key); return; }
  if (ev.key === 'Escape') {
    const L = topLayer(); if (!L) return;
    if (L.dataset.id === 'composer') composerClose();
    else if (L.dataset.id !== 'welcome') closeLayer(L);
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
}
function vv() {
  const v = window.visualViewport; if (!v) return;
  R.style.setProperty('--vvh', v.height + 'px'); R.style.setProperty('--vvt', v.offsetTop + 'px');
}

/* ================= shell + boot ================= */
function buildShell() {
  $('#app').innerHTML = `
    <main id="scroll">
      <header class="top"><div class="top-in"><span class="brand">${mochiSVG('happy')}Mochi Diary</span><span class="sp"></span><button class="tbtn av" data-act="you" aria-label="You and settings">${mochiSVG('idle')}</button></div></header>
      <div class="wrap" id="view"></div>
    </main>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-act="tab" data-tab="diary">${ic('diary')}Diary</button>
      <button class="tab" data-act="tab" data-tab="cards">${ic('cards')}Cards</button>
      <button class="fab" data-act="new" aria-label="Tell Mochi about your day">${mochiSVG('happy')}<span class="plus">${ic('plus')}</span></button>
      <button class="tab" data-act="tab" data-tab="trends">${ic('trends')}Trends</button>
      <button class="tab" data-act="tab" data-tab="dives">${ic('dives')}Dives</button>
    </nav>`;
  $('#splash').insertAdjacentHTML('afterbegin', mochiSVG('happy'));
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  if (window.visualViewport) { visualViewport.addEventListener('resize', vv); visualViewport.addEventListener('scroll', vv); }
  vv();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) S.hidden = Date.now();
    else if (S.meta && S.meta.pinHash && S.hidden && Date.now() - S.hidden >= S.meta.lockAfter * 60000 && $('#lock').hidden) showLock();
  });
  setInterval(() => { if (S.meta && S.tab === 'diary' && !topLayer() && document.visibilityState === 'visible' && render.day !== dayKey()) { render.day = dayKey(); render(); } }, 60000);
  render.day = dayKey();
}
function onRemoteEntries(list, md) {
  let changed = false;
  const ids = new Set();
  for (const raw of list) {
    const e = sanitizeEntry(raw); if (!e) continue; ids.add(e.id);
    const cur = byId(e.id);
    if (!cur) { S.entries.push(e); changed = true; }
    else if ((e.updated || 0) > (cur.updated || 0)) { Object.assign(cur, e); changed = true; }
  }
  if (md && !md.fromCache) {
    const before = S.entries.length;
    S.entries = S.entries.filter(e => ids.has(e.id) || Date.now() - (e.updated || 0) < 20000);
    if (S.entries.length !== before) changed = true;
  }
  if (changed) { sortEntries(); if (!layerById('composer')) render(); refreshReader(); }
}
function onRemoteMeta(m) {
  if (!m || (Number(m.updatedAt) || 0) <= (S.meta.updatedAt || 0)) return;
  const busy = $('#y-name') === document.activeElement || $('#y-notes') === document.activeElement;
  if (busy) return;
  S.meta = normalizeMeta(m); applyLook(); render(); refreshYou();
}
async function start(store) {
  const d = await store.init();
  S.store = store;
  S.meta = normalizeMeta(d.meta);
  S.entries = (d.entries || []).map(sanitizeEntry).filter(Boolean);
  for (const e of S.entries) if (e.status === 'reading' && Date.now() - e.updated > 180000) e.status = 'pending';
  sortEntries();
  S.reports = {}; for (const r of d.reports || []) if (r && r.id && r.data) S.reports[r.id] = r;
  applyLook(); render();
  if (store.subscribe) store.subscribe(onRemoteEntries, onRemoteMeta);
}
async function mergeLocal(local, cloud) {
  let d; try { d = await local.init(); } catch { return; }
  const ents = (d.entries || []).map(sanitizeEntry).filter(Boolean);
  if (!ents.length && !d.meta) return;
  let moved = 0;
  for (const e of ents) {
    const cur = byId(e.id);
    if (cur && (cur.updated || 0) >= (e.updated || 0)) continue;
    if (e.photo && e.photo.id) { try { const u = await local.getMedia(e.photo.id); if (u) e.photo.n = await cloud.putMedia(e.photo.id, u); } catch {} }
    if (cur) Object.assign(cur, e); else S.entries.push(e);
    await cloud.putEntry(e); moved++;
  }
  if (d.meta && !S.meta.welcomed) { S.meta = normalizeMeta(Object.assign({}, d.meta, { updatedAt: Date.now() })); await cloud.putMeta(S.meta); applyLook(); }
  try { await local.clearAll(); const db = await local.open(); if (db) await local.req(db, 'kv', 'readwrite', s => s.delete('meta')); } catch {}
  if (moved) { sortEntries(); render(); toast(`Moved ${moved} day${moved > 1 ? 's' : ''} from this browser into your account.`); }
}
async function boot() {
  buildShell();
  aiInit().then(() => { if (S.meta) { render(); refreshYou(); } });
  const local = new LocalStore();
  let cloud = null;
  const cl = window.claude;
  if (TAURI) {
    try { await start(new DesktopStore(TAURI)); }
    catch (err) {
      console.warn('Mochi: diary folder unavailable', err);
      local.dbp = Promise.resolve(null); // keep this session in memory, never in a second place
      await start(local);
      setTimeout(() => toast(`Couldn't open your diary folder (${err}). Changes in this window won't be kept.`), 600);
    }
  } else if (cl && typeof cl.use === 'function') {
    cl.use('downloads').then(x => { DL = x || null; }).catch(() => {});
    const cp = (async () => {
      try {
        const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
        if (!db || !user) return null;
        const id = await user.id();
        return id ? new CloudStore(db, id) : null;
      } catch { return null; }
    })();
    cloud = await Promise.race([cp, sleep(4000).then(() => null)]);
    if (!cloud) cp.then(async c => {
      if (!c || !S.store || S.store.kind !== 'local' || C) return;
      try { await start(c); await mergeLocal(local, c); toast('Now saving to your account'); } catch {}
    });
  }
  if (!TAURI) try {
    if (cloud) { await start(cloud); await mergeLocal(local, cloud); }
    else await start(local);
  } catch (err) {
    console.warn('Mochi: falling back to this browser', err);
    try { await start(local); } catch { S.store = local; S.meta = normalizeMeta(null); S.entries = []; render(); }
  }
  const sp = $('#splash'); sp.classList.add('gone'); setTimeout(() => sp.remove(), 400);
  if (S.meta.pinHash) showLock();
  if (!S.meta.welcomed && !S.entries.length) openWelcome();
}
boot();

})();
</script>
