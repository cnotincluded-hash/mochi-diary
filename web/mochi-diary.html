<title>Mochi Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Mochiy+Pop+One&display=swap">
<style>
/* Layout: one soft column of sticker cards on milky polka-dot paper. A floating pill tab bar with a squishy
   mochi button in the middle; sheets rise from the bottom and become centred dialogs on wide screens. */
:root{
  /* flavour (strawberry by default; others below) */
  --fl:#FF7FA8; --fl-deep:#D9497C; --fl-soft:#FFE3EC; --fl-paper:#FFF5F8; --fl-dot:#FFE2EB; --mo-body:#FFE6EE; --mo-dust:#FFC6D7;
  /* neutrals, tinted toward the flavour */
  --paper:var(--fl-paper); --dot:var(--fl-dot); --card:#FFFFFF; --card-2:#FFF7F9; --sunk:#FBEFF3;
  --ink:#4B3646; --ink-2:#86707F; --ink-3:#BBA9B5; --line:#F0DEE6; --on-fl:#FFFFFF;
  --accent:var(--fl); --accent-ink:var(--fl-deep); --accent-soft:var(--fl-soft);
  /* the five life metrics */
  --joy:#FFC24B; --stress:#FF8E7A; --social:#FF8FBF; --productivity:#6FB9EE; --energy:#6BCB8F;
  --joy-s:#FFF1CC; --stress-s:#FFE2DB; --social-s:#FFE1EE; --productivity-s:#DDEFFC; --energy-s:#DCF4E4;
  --up:#3E9F63; --down:#D2604C;
  --shadow-ink:rgba(75,54,70,.10); --mo-shadow:rgba(75,54,70,.12); --scrim:rgba(60,35,52,.32);
  --glass:rgba(255,255,255,.82); --fill-op:.55;
  --sticker:0 3px 0 var(--shadow-ink),0 10px 24px -14px rgba(120,60,90,.35);
  --f-display:"Mochiy Pop One","M PLUS Rounded 1c",ui-rounded,"Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c",ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  --r-card:26px; --ease:cubic-bezier(.34,1.4,.64,1); --ease-out:cubic-bezier(.22,1,.36,1);
}
:root[data-flavor="matcha"]{--fl:#5FBF83;--fl-deep:#2F8452;--fl-soft:#DDF3E2;--fl-paper:#F4FBF4;--fl-dot:#DCF0DD;--mo-body:#E2F5DE;--mo-dust:#B9E3B9}
:root[data-flavor="ube"]{--fl:#A68AF0;--fl-deep:#6E4ED0;--fl-soft:#ECE5FF;--fl-paper:#F8F5FF;--fl-dot:#E7DFFF;--mo-body:#EDE6FF;--mo-dust:#D0C2FA}
:root[data-flavor="mango"]{--fl:#FFAE3B;--fl-deep:#B66A00;--fl-soft:#FFF0D2;--fl-paper:#FFF9EF;--fl-dot:#FFEACB;--mo-body:#FFF1CF;--mo-dust:#FFD68C}
:root[data-flavor="soda"]{--fl:#5DB4EC;--fl-deep:#1F77B4;--fl-soft:#DDF0FE;--fl-paper:#F3F9FF;--fl-dot:#DAECFC;--mo-body:#E1F1FF;--mo-dust:#B5DBF7}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#221A27; --dot:#2D2333; --card:#2E2437; --card-2:#352A3F; --sunk:#291F30;
    --ink:#F8EAF2; --ink-2:#C5AEBE; --ink-3:#7F6B7B; --line:#43354C; --on-fl:#2A1B26;
    --accent-ink:var(--fl); --accent-soft:color-mix(in srgb,var(--fl) 22%,transparent);
    --joy-s:rgba(255,194,75,.18); --stress-s:rgba(255,142,122,.18); --social-s:rgba(255,143,191,.18); --productivity-s:rgba(111,185,238,.18); --energy-s:rgba(107,203,143,.18);
    --up:#7FD8A0; --down:#FF9C88;
    --shadow-ink:rgba(0,0,0,.35); --mo-shadow:rgba(0,0,0,.3); --scrim:rgba(10,4,12,.6);
    --glass:rgba(46,36,55,.86); --fill-op:.85;
    --sticker:0 3px 0 rgba(0,0,0,.35),0 12px 26px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#221A27; --dot:#2D2333; --card:#2E2437; --card-2:#352A3F; --sunk:#291F30;
  --ink:#F8EAF2; --ink-2:#C5AEBE; --ink-3:#7F6B7B; --line:#43354C; --on-fl:#2A1B26;
  --accent-ink:var(--fl); --accent-soft:color-mix(in srgb,var(--fl) 22%,transparent);
  --joy-s:rgba(255,194,75,.18); --stress-s:rgba(255,142,122,.18); --social-s:rgba(255,143,191,.18); --productivity-s:rgba(111,185,238,.18); --energy-s:rgba(107,203,143,.18);
  --up:#7FD8A0; --down:#FF9C88;
  --shadow-ink:rgba(0,0,0,.35); --mo-shadow:rgba(0,0,0,.3); --scrim:rgba(10,4,12,.6);
  --glass:rgba(46,36,55,.86); --fill-op:.85;
  --sticker:0 3px 0 rgba(0,0,0,.35),0 12px 26px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(var(--dot) 1.7px,transparent 2px) 0 0/22px 22px,var(--paper);color:var(--ink);font:500 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:14px}
::placeholder{color:var(--ink-3);opacity:1}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.005em}
.num{font-variant-numeric:tabular-nums}

/* mochi */
.mochi-svg{display:block;overflow:visible}
.mo-body{fill:var(--mo-body)}
.mo-dust{fill:var(--mo-dust)}
.mo-shadow{fill:var(--mo-shadow)}
.mo-squish{transform-box:fill-box;transform-origin:50% 100%;animation:squish 3.4s ease-in-out infinite}
.mo-eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.mo-dots circle{animation:dot 1.2s infinite both}
.mo-dots circle:nth-child(2){animation-delay:.2s}.mo-dots circle:nth-child(3){animation-delay:.4s}
.boing .mo-squish{animation:boing .7s var(--ease) 1,squish 3.4s ease-in-out .7s infinite}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
@keyframes boing{0%{transform:scale(1,1)}25%{transform:scale(1.14,.82)}55%{transform:scale(.9,1.14) translateY(-9%)}80%{transform:scale(1.05,.95)}100%{transform:scale(1,1)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.ani,.stk{display:block;overflow:visible}

/* ---------- shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
#scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-padding-top:70px}
.wrap{max-width:580px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 132px;display:flex;flex-direction:column;gap:18px}
.top{position:sticky;top:0;z-index:6;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.top::before{content:"";position:absolute;inset:0 0 -14px;background:linear-gradient(var(--paper) 55%,transparent);pointer-events:none;z-index:-1}
.top-in{display:flex;align-items:center;gap:10px;max-width:548px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font:400 19px/1 var(--f-display);color:var(--accent-ink)}
.brand .mochi-svg{width:34px;height:31px}
.brand .mo-squish{animation:none}
.top .sp{flex:1}
.tbtn{height:40px;min-width:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;background:var(--card);box-shadow:var(--sticker);color:var(--ink);font-weight:700;font-size:14px}
.tbtn .ic{width:20px;height:20px}
.av{width:40px;padding:0;overflow:hidden}
.av .mochi-svg{width:34px;height:31px;margin-top:4px}
.av .mo-squish{animation:none}

/* tab bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;width:min(440px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));height:66px;padding:0 6px;border-radius:33px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:0 0 0 2px var(--line),var(--sticker)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border-radius:24px;font-size:11.5px;font-weight:800;color:var(--ink-2);letter-spacing:.02em}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent-ink);background:var(--accent-soft)}
.tab:active{transform:scale(.92)}
.fab{justify-self:center;width:72px;height:72px;margin-top:-30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--line),0 10px 22px -8px var(--accent);transition:transform .3s var(--ease)}
.fab:active{transform:scale(.88)}
.fab .mochi-svg{width:52px;height:47px;margin-top:4px}
.fab .plus{position:absolute;right:0;bottom:2px;width:24px;height:24px;border-radius:50%;background:var(--card);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 2px var(--accent)}
.fab .plus .ic{width:16px;height:16px;stroke-width:3}
.fab{position:relative}

/* buttons + chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:25px;font-weight:800;font-size:16px;white-space:nowrap;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.95)}
.btn .ic{width:20px;height:20px;stroke-width:2.4}
.btn.pri{background:var(--accent);color:var(--on-fl);box-shadow:0 4px 0 color-mix(in srgb,var(--fl-deep) 70%,transparent)}
.btn.sec{background:var(--card);color:var(--accent-ink);box-shadow:0 0 0 2px var(--line),0 3px 0 var(--shadow-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost{color:var(--accent-ink);padding:0 10px}
.btn.danger{background:var(--stress-s);color:var(--down)}
.btn.sm{min-height:38px;padding:0 15px;border-radius:19px;font-size:14px}
.btn.sm .ic{width:17px;height:17px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:3px 12px;border-radius:16px;background:var(--sunk);color:var(--ink);font-size:13.5px;font-weight:700;max-width:100%;line-height:1.25}
.chip .ic{width:15px;height:15px}
.chip.up{background:var(--energy-s);color:var(--up)}
.chip.dn{background:var(--stress-s);color:var(--down)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}

/* cards */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sticker);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;position:relative}
.card.tight{padding:14px}
.card-h{display:flex;align-items:center;gap:10px;min-width:0}
.card-h h2{font:400 18px/1.25 var(--f-display);flex:1;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 4px 0}
.sec-h h2{font:400 20px/1.2 var(--f-display)}

/* hello */
.hello{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:end;padding:6px 2px 0}
.hello .mochi-wrap{grid-row:span 2;width:108px;height:98px;position:relative}
.hello .mochi-svg{width:108px;height:98px}
.bubble{position:relative;background:var(--card);border-radius:22px 22px 22px 6px;padding:11px 15px;box-shadow:var(--sticker);font-size:15px;font-weight:600;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.bubble::before{content:"";position:absolute;left:-7px;bottom:8px;width:14px;height:14px;background:var(--card);clip-path:polygon(100% 0,0 100%,100% 100%);border-radius:0 0 3px 0}
.hello h1{font:400 clamp(22px,6.2vw,28px)/1.18 var(--f-display);grid-column:1/-1;padding:6px 2px 0}
.hello .sub{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2);font-weight:700;font-size:14px;padding:0 2px}
.streak{display:inline-flex;align-items:center;gap:4px;padding:3px 10px 3px 6px;border-radius:14px;background:var(--joy-s);color:#B97800;font-weight:800;font-size:13px}
:root[data-theme="dark"] .streak{color:var(--joy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .streak{color:var(--joy)}}
.streak .ic{width:16px;height:16px;fill:var(--joy);stroke:#B97800}

/* today's vibe */
.vibe{overflow:hidden}
.vibe-top{display:flex;align-items:center;gap:14px;min-width:0}
.ani-badge{flex:none;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,var(--card) 0 52%,var(--accent-soft) 53%);position:relative}
.ani-badge .ani{width:78px;height:78px}
.ani-badge.sm{width:52px;height:52px}.ani-badge.sm .ani{width:46px;height:46px}
.vibe-txt{min-width:0;display:flex;flex-direction:column;gap:3px}
.vibe-txt h2{font:400 21px/1.2 var(--f-display)}
.vibe-txt p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.4}
.scores{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.sc-blob{width:100%;max-width:60px;aspect-ratio:1;border-radius:46% 54% 50% 50%/55% 48% 52% 45%;display:grid;place-items:center;background:var(--m-s);color:var(--ink);font:400 22px/1 var(--f-display);position:relative;overflow:hidden}
.sc-blob::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--v) * 10%);background:var(--m);opacity:var(--fill-op);border-radius:40% 40% 0 0/12px 12px 0 0}
.sc-blob span{position:relative;z-index:1}
.sc-l{font-size:11.5px;font-weight:800;color:var(--ink-2);text-align:center;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.m-joy{--m:var(--joy);--m-s:var(--joy-s)}.m-stress{--m:var(--stress);--m-s:var(--stress-s)}.m-social{--m:var(--social);--m-s:var(--social-s)}.m-productivity{--m:var(--productivity);--m-s:var(--productivity-s)}.m-energy{--m:var(--energy);--m-s:var(--energy-s)}
.factors{display:flex;flex-direction:column;gap:6px}
.fac{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;min-width:0}
.fac .dotm{width:10px;height:10px;border-radius:50%;background:var(--m);flex:none}
.fac .lab{flex:1;min-width:0;overflow-wrap:anywhere}
.fac .eff{font-weight:800;font-size:13px;flex:none;font-variant-numeric:tabular-nums}
.eff.u{color:var(--up)}.eff.d{color:var(--down)}

/* call-to-action card */
.cta{align-items:center;text-align:center;gap:12px;padding:22px 18px;background:linear-gradient(160deg,var(--card) 40%,var(--accent-soft))}
.cta h2{font:400 22px/1.2 var(--f-display)}
.cta p{margin:0;color:var(--ink-2);max-width:34ch}
.cta .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* entry cards */
.month{font:400 15px/1 var(--f-display);color:var(--ink-2);padding:10px 4px 0}
.ecard{background:var(--card);border-radius:var(--r-card);box-shadow:var(--sticker);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0;transition:transform .25s var(--ease)}
.ecard:active{transform:scale(.98)}
.scene{position:relative;height:118px;background:radial-gradient(120% 140% at 0% 0%,var(--sc1,var(--accent-soft)) 0%,transparent 60%),radial-gradient(120% 140% at 100% 100%,var(--sc2,var(--sunk)) 0%,transparent 70%),var(--card-2);overflow:hidden;flex:none}
.scene::before{content:"";position:absolute;inset:0;background:radial-gradient(color-mix(in srgb,var(--card) 70%,transparent) 1.4px,transparent 1.8px) 0 0/16px 16px;opacity:.7}
.scene .ani{position:absolute;left:16px;bottom:-6px;width:96px;height:96px;filter:drop-shadow(0 3px 0 var(--shadow-ink))}
.scene .stk{position:absolute;width:42px;height:42px;filter:drop-shadow(0 2px 0 var(--shadow-ink))}
.scene .s0{right:22px;top:16px;transform:rotate(8deg)}
.scene .s1{right:78px;top:54px;transform:rotate(-10deg)}
.scene .s2{right:132px;top:14px;transform:rotate(6deg);width:36px;height:36px}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene .datebadge{position:absolute;top:12px;left:14px;z-index:2}
.scene.photo .ani{left:auto;right:12px;bottom:8px;width:60px;height:60px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.datebadge{display:inline-flex;flex-direction:column;align-items:center;line-height:1;padding:6px 9px 7px;border-radius:14px;background:var(--card);box-shadow:0 2px 0 var(--shadow-ink);min-width:44px}
.datebadge small{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--ink-2)}
.datebadge b{font:400 19px/1.05 var(--f-display);color:var(--accent-ink);margin-top:3px}
.scene .mochi-svg{position:absolute;left:50%;top:50%;width:92px;height:83px;margin:-38px 0 0 -46px}
.ec-body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ec-title{font:400 18px/1.25 var(--f-display);overflow-wrap:anywhere}
.ec-snap{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ec-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.mini{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px 0 7px;border-radius:13px;background:var(--m-s);font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.mini i{width:8px;height:8px;border-radius:50%;background:var(--m);display:block}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:800;background:var(--sunk);color:var(--ink-2)}
.pill .ic{width:14px;height:14px}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}

/* empty states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 12px}
.empty .mochi-svg{width:120px;height:108px}
.empty h2{font:400 20px/1.25 var(--f-display)}
.empty p{margin:0;color:var(--ink-2);max-width:36ch}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 10px 10px 16px;border-radius:20px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:14px}
.banner .bt{flex:1;min-width:14ch}
.care{background:var(--social-s);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.care b{font:400 16px/1.3 var(--f-display)}
.care a{color:var(--accent-ink);font-weight:800}

/* insight cards */
.icard{gap:10px;padding:18px 18px 12px;overflow:hidden}
.icard::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--t-s);opacity:.9}
.icard > *{position:relative}
.itype{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;height:28px;padding:0 12px 0 8px;border-radius:14px;background:var(--t-s);color:var(--ink);font-size:12.5px;font-weight:800;letter-spacing:.03em}
.itype i{width:12px;height:12px;border-radius:50%;background:var(--t)}
.icard h3{font:400 20px/1.25 var(--f-display)}
.icard p{margin:0;line-height:1.5}
.why{font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:flex-start}
.why .ic{width:16px;height:16px;margin-top:2px;color:var(--accent-ink)}
.ifoot{display:flex;align-items:center;gap:4px;border-top:2px dashed var(--line);padding-top:8px;margin-top:2px}

/* trends */
.mcard{padding:0;gap:0;overflow:hidden}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) 110px;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}

.zoo .nm{font-size:12px;font-weight:800;line-height:1.2}

@media (min-width:480px){.zoo{grid-template-columns:repeat(8,minmax(0,1fr))}.zoo .ani{width:50px;height:50px}}

.pat{border-left:4px solid var(--accent);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:4px}

/* ---------- sheets ---------- */
#layers{position:relative;z-index:50}

.sheet{position:relative;width:100%;max-width:640px;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.8px);background-size:22px 22px;border-radius:34px 34px 0 0;height:calc(100% - env(safe-area-inset-top,0px) - 12px);animation:up .5s var(--ease-out);box-shadow:0 -12px 40px -18px rgba(0,0,0,.4)}

}
.sh-head{display:grid;grid-template-columns:minmax(44px,1fr) minmax(0,auto) minmax(44px,1fr);align-items:center;gap:8px;padding:14px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px));flex:none;position:relative;z-index:2}

.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:0 0 0 2px var(--line),0 3px 0 var(--shadow-ink);color:var(--ink);flex:none}
.rbtn .ic{width:20px;height:20px;stroke-width:2.4}
.rbtn.pri{background:var(--accent);color:var(--on-fl);box-shadow:0 3px 0 color-mix(in srgb,var(--fl-deep) 70%,transparent)}
.hgrp{display:flex;gap:8px}
.sh-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(28px + env(safe-area-inset-bottom,0px))}
.sh-foot{flex:none;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;background:linear-gradient(transparent,var(--paper) 30%)}
.stack{display:flex;flex-direction:column;gap:16px}

/* composer */
.steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.stp{height:30px;padding:0 11px;border-radius:15px;font-size:12.5px;font-weight:800;color:var(--ink-2);background:var(--card);box-shadow:0 0 0 2px var(--line)}

.q-wrap{display:flex;gap:12px;align-items:flex-end}

.starter{min-height:34px;padding:4px 13px;border-radius:17px;background:var(--card);box-shadow:0 0 0 2px var(--line);font-size:14px;font-weight:700;color:var(--ink);text-align:left}

.tip{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);font-weight:700}

.photo-chip span{flex:1;font-size:14px;font-weight:700}
.datebtn{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:20px;font:400 15px/1 var(--f-display);color:var(--accent-ink)}
.datebtn .ic{width:16px;height:16px}
.recap{display:flex;flex-direction:column;gap:10px}

/* reader */
.rscene{height:180px;border-radius:28px;box-shadow:var(--sticker)}
.rscene .ani{width:150px;height:150px;left:20px;bottom:-12px}
.rscene .stk{width:54px;height:54px}
.rscene.photo{height:240px}
.rhead{display:flex;flex-direction:column;gap:4px;padding:0 4px}

.bar{height:14px;border-radius:7px;background:var(--m-s);overflow:hidden}

details.said summary{cursor:pointer;font-weight:800;color:var(--accent-ink);list-style:none;display:flex;align-items:center;gap:6px}

.hearts{display:flex;gap:4px}

.edit-ta{width:100%;min-height:120px;border:0;border-radius:18px;background:var(--sunk);padding:12px 14px;outline:none;resize:vertical;line-height:1.5}

/* menus, alerts */
.layer.k-pop{display:block}
.layer.k-pop .scrim{background:transparent;animation:none}
.menu{position:absolute;min-width:230px;max-width:min(300px,calc(100vw - 24px));padding:6px;border-radius:24px;background:var(--card);box-shadow:0 0 0 2px var(--line),0 18px 40px -12px rgba(0,0,0,.35);animation:popin .3s var(--ease);transform-origin:90% 0}
.mi-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 14px;border-radius:18px;font-weight:700;text-align:left}
.mi-btn:hover,.mi-btn:focus-visible{background:var(--sunk)}

.alertbox{position:relative;width:min(340px,100%);border-radius:32px;background:var(--card);padding:22px 18px 16px;text-align:center;animation:popin .32s var(--ease);box-shadow:0 24px 60px -16px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px;align-items:center}
.alertbox .mochi-svg{width:84px;height:76px}
.alertbox h2{font:400 18px/1.3 var(--f-display)}
.alertbox p{margin:0;color:var(--ink-2);font-size:14.5px}
.alertbox .row{display:flex;gap:10px;margin-top:10px;width:100%}
.alertbox .row .btn{flex:1;padding:0 12px}

/* settings */
.grp{background:var(--card);border-radius:24px;box-shadow:var(--sticker);overflow:hidden}
.srow2{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;width:100%;text-align:left}
.grp > .srow2 + .srow2,.grp > * + .srow2{border-top:2px solid var(--line)}
.srow2 .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}

.srow2.col{flex-direction:column;align-items:stretch}

.srow2.danger,.srow2.danger .ic{color:var(--down)}
.field{width:100%;min-height:48px;border:0;border-radius:16px;background:var(--sunk);padding:12px 14px;outline:none;font-size:16px;line-height:1.45}
textarea.field{resize:vertical;min-height:96px}
.field:focus{box-shadow:0 0 0 3px var(--accent)}
.lbl{font-size:13px;font-weight:800;color:var(--ink-2);padding:0 6px}

.flavors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}

.flv[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:0 0 0 2px var(--accent)}
.flv-strawberry{--mo-body:#FFE6EE;--mo-dust:#FFC6D7}.flv-matcha{--mo-body:#E2F5DE;--mo-dust:#B9E3B9}.flv-ube{--mo-body:#EDE6FF;--mo-dust:#D0C2FA}.flv-mango{--mo-body:#FFF1CF;--mo-dust:#FFD68C}.flv-soda{--mo-body:#E1F1FF;--mo-dust:#B5DBF7}

/* lock + welcome + splash */
#lock{position:fixed;inset:0;z-index:100;background:radial-gradient(var(--dot) 1.7px,transparent 2px) 0 0/22px 22px,var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));text-align:center}
.pin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}

@keyframes up{from{transform:translateY(60%)}}
@keyframes down{to{transform:translateY(70%);opacity:0}}

</style>

<script>
(() => {
'use strict';
/* ================= art: Mochi, animal friends, stickers, icons ================= */
const INK = '#4B3646';
const BLUSH = '#FF9DB8';

/* Mochi, the diary buddy. A squishy daifuku with a face that changes with the moment. */
function mochiSVG(expr = 'idle', cls = '') {
  const E = {
    idle: `<g class="mo-eyes"><circle cx="46" cy="60" r="4.8" fill="${INK}"/><circle cx="74" cy="60" r="4.8" fill="${INK}"/><circle cx="47.6" cy="58.3" r="1.6" fill="#fff"/><circle cx="75.6" cy="58.3" r="1.6" fill="#fff"/></g>`,
    happy: `<path d="M40 62 Q46 54 52 62M68 62 Q74 54 80 62" fill="none" stroke="${INK}" stroke-width="3.6" stroke-linecap="round"/>`,
    think: `<g class="mo-eyes"><circle cx="48" cy="56" r="4.8" fill="${INK}"/><circle cx="76" cy="56" r="4.8" fill="${INK}"/><circle cx="49.4" cy="54.4" r="1.6" fill="#fff"/><circle cx="77.4" cy="54.4" r="1.6" fill="#fff"/></g>`,
    sleepy: `<path d="M40 60 Q46 65 52 60M68 60 Q74 65 80 60" fill="none" stroke="${INK}" stroke-width="3.4" stroke-linecap="round"/>`,
    love: `<path d="M46 66 C38 59 39 52 43.5 52 C45.5 52 46 54 46 55 C46 54 46.5 52 48.5 52 C53 52 54 59 46 66Z M74 66 C66 59 67 52 71.5 52 C73.5 52 74 54 74 55 C74 54 74.5 52 76.5 52 C81 52 82 59 74 66Z" fill="#FF5C8A" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`,
    wow: `<g class="mo-eyes"><circle cx="46" cy="59" r="6.6" fill="${INK}"/><circle cx="74" cy="59" r="6.6" fill="${INK}"/><circle cx="48.4" cy="56.4" r="2.4" fill="#fff"/><circle cx="76.4" cy="56.4" r="2.4" fill="#fff"/><circle cx="44" cy="61.6" r="1.1" fill="#fff"/><circle cx="72" cy="61.6" r="1.1" fill="#fff"/></g>`,
    sad: `<g class="mo-eyes"><circle cx="46" cy="61" r="4.4" fill="${INK}"/><circle cx="74" cy="61" r="4.4" fill="${INK}"/><circle cx="47.4" cy="59.6" r="1.4" fill="#fff"/><circle cx="75.4" cy="59.6" r="1.4" fill="#fff"/></g><path d="M38 52 L50 55M82 52 L70 55" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`
  };
  const M = {
    idle: `<path d="M55 70 Q60 75 65 70" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round"/>`,
    happy: `<path d="M52 69 Q60 81 68 69Z" fill="#8C3A55" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/><path d="M56 74.5 Q60 72 64 74.5 Q60 78.5 56 74.5Z" fill="#FF8FAE"/>`,
    think: `<circle cx="62" cy="72" r="2.6" fill="${INK}"/>`,
    sleepy: `<ellipse cx="60" cy="72" rx="2.4" ry="3" fill="${INK}"/>`,
    love: `<path d="M53 69 Q60 79 67 69" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round"/>`,
    wow: `<ellipse cx="60" cy="73" rx="3.6" ry="4.6" fill="#8C3A55" stroke="${INK}" stroke-width="2"/>`,
    sad: `<path d="M55 75 Q60 70 65 75" fill="none" stroke="${INK}" stroke-width="2.8" stroke-linecap="round"/>`
  };
  const extra = {
    think: `<g class="mo-dots"><circle cx="99" cy="30" r="3" fill="${INK}"/><circle cx="106" cy="21" r="3.6" fill="${INK}"/><circle cx="113" cy="11" r="4.2" fill="${INK}"/></g>`,
    sleepy: `<path d="M94 16 h9 l-9 10 h9M106 4 h6 l-6 7 h6" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`,
    love: `<path d="M101 26 C96 22 97 17 100 17 C101.4 17 102 18.4 102 19 C102 18.4 102.6 17 104 17 C107 17 108 22 101 26Z" fill="#FF5C8A"/><path d="M14 22 C10 19 10.8 15 13.2 15 C14.3 15 14.8 16 14.8 16.6 C14.8 16 15.3 15 16.4 15 C18.8 15 19.6 19 14 22Z" fill="#FF8FAE"/>`,
    wow: `<path d="M100 18 l2 -7 l2 7 l7 2 l-7 2 l-2 7 l-2 -7 l-7 -2Z" fill="#FFC95E" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/>`,
    happy: '', idle: '', sad: `<path d="M84 64 q3 6 0 8 q-3 -2 0 -8Z" fill="#8ECDF8" stroke="${INK}" stroke-width="1.2"/>`
  };
  const e = E[expr] ? expr : 'idle';
  return `<svg class="mochi-svg ${cls}" viewBox="0 0 120 108" aria-hidden="true"><ellipse class="mo-shadow" cx="60" cy="101" rx="36" ry="4.6"/><g class="mo-squish"><path d="M14 78 C12 46 34 22 60 22 C86 22 108 46 106 78 C105 92 86 98 60 98 C34 98 15 92 14 78Z" class="mo-body" stroke="${INK}" stroke-width="3.2"/><ellipse cx="40" cy="40" rx="11" ry="5.5" transform="rotate(-28 40 40)" fill="#fff" opacity=".85"/><circle cx="56" cy="31" r="2.2" fill="#fff" opacity=".7"/><circle cx="84" cy="40" r="1.6" class="mo-dust"/><circle cx="92" cy="54" r="1.3" class="mo-dust"/><circle cx="28" cy="84" r="1.5" class="mo-dust"/><circle cx="88" cy="86" r="1.3" class="mo-dust"/><ellipse cx="34" cy="71" rx="8.2" ry="4.6" fill="${BLUSH}" opacity=".75"/><ellipse cx="86" cy="71" rx="8.2" ry="4.6" fill="${BLUSH}" opacity=".75"/>${E[e]}${M[e]}</g>${extra[e] || ''}</svg>`;
}

/* ---------- animal friends (the daily vibe) ---------- */
const ANIMALS = {
  bunny:    { name: 'Bunny',    c: '#FFFFFF', c2: '#FFD3E1', ears: 'bunny',  eyes: 'sparkle', meaning: 'bouncy, buzzing energy' },
  puppy:    { name: 'Puppy',    c: '#F4D3AA', c2: '#FFF3E2', e2: '#D9A26E', ears: 'floppy', eyes: 'happy', muzzle: 1, tongue: 1, meaning: 'happy to see everyone' },
  otter:    { name: 'Otter',    c: '#C29673', c2: '#F1DECB', ears: 'small',  muzzle: 1, whisk: 1, meaning: 'playful and connected' },
  fox:      { name: 'Fox',      c: '#FFB07A', c2: '#FFFFFF', ears: 'fox',    foxcheek: 1, meaning: 'sharp and on it' },
  hamster:  { name: 'Hamster',  c: '#FFCB93', c2: '#FFF4E6', ears: 'mouse',  pouch: 1, meaning: 'busy, busy wheel' },
  penguin:  { name: 'Penguin',  c: '#62708A', c2: '#FFFFFF', ears: 'none',   penguin: 1, beak: 'owl', meaning: 'marching through it' },
  bear:     { name: 'Bear',     c: '#D8AE8A', c2: '#F4DFC9', ears: 'round',  muzzle: 1, meaning: 'steady and grounded' },
  cat:      { name: 'Cat',      c: '#FFDCB0', c2: '#FFC1CF', ears: 'cat',    eyes: 'content', whisk: 1, meaning: 'content doing your own thing' },
  frog:     { name: 'Frog',     c: '#A5DD94', c2: '#E2F6D8', ears: 'frog',   frog: 1, meaning: 'chill, just vibing' },
  panda:    { name: 'Panda',    c: '#FFFFFF', c2: '#F2F2F2', ears: 'dark',   panda: 1, meaning: 'soft, slow and cozy' },
  owl:      { name: 'Owl',      c: '#C9A98A', c2: '#F6ECDF', ears: 'tufts',  owl: 1, beak: 'owl', meaning: 'thoughtful, deep in your head' },
  koala:    { name: 'Koala',    c: '#C9CDD8', c2: '#F3F3F7', ears: 'koala',  eyes: 'sleepy', bignose: 1, meaning: 'sleepy, could use a nap' },
  sloth:    { name: 'Sloth',    c: '#CDB497', c2: '#F2E5D3', ears: 'none',   sloth: 1, meaning: 'low battery, taking it slow' },
  hedgehog: { name: 'Hedgehog', c: '#F5DFC6', c2: '#A9805F', ears: 'spikes', brows: 1, meaning: 'a little prickly today' },
  duckling: { name: 'Duckling', c: '#FFE27A', c2: '#FFB547', ears: 'tuft',   beak: 'duck', meaning: 'trying something new' },
  piglet:   { name: 'Piglet',   c: '#FFC6D4', c2: '#FF9FB8', ears: 'pig',    snout: 1, meaning: 'treating yourself' }
};
const ANIMAL_IDS = Object.keys(ANIMALS);

function animalSVG(id, cls = '') {
  const a = ANIMALS[id] || ANIMALS.cat;
  const S = `stroke="${INK}" stroke-width="2.8" stroke-linejoin="round"`;
  const s2 = `stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"`;
  let back = '', face = '', eyes = '', nose = '', mouth = '', top = '';
  const pink = '#FFB3C7';
  switch (a.ears) {
    case 'bunny': back = `<ellipse cx="37" cy="24" rx="8.5" ry="21" transform="rotate(-12 37 24)" fill="${a.c}" ${S}/><ellipse cx="63" cy="24" rx="8.5" ry="21" transform="rotate(12 63 24)" fill="${a.c}" ${S}/><ellipse cx="37" cy="26" rx="4" ry="14" transform="rotate(-12 37 26)" fill="${a.c2}"/><ellipse cx="63" cy="26" rx="4" ry="14" transform="rotate(12 63 26)" fill="${a.c2}"/>`; break;
    case 'cat': back = `<path d="M22 46 L27 15 L47 31Z" fill="${a.c}" ${S}/><path d="M78 46 L73 15 L53 31Z" fill="${a.c}" ${S}/><path d="M28 36 L30 22 L40 31Z" fill="${pink}"/><path d="M72 36 L70 22 L60 31Z" fill="${pink}"/>`; break;
    case 'fox': back = `<path d="M18 50 L22 9 L48 30Z" fill="${a.c}" ${S}/><path d="M82 50 L78 9 L52 30Z" fill="${a.c}" ${S}/><path d="M25 37 L26 20 L39 30Z" fill="#fff"/><path d="M75 37 L74 20 L61 30Z" fill="#fff"/>`; break;
    case 'round': back = `<circle cx="27" cy="31" r="11" fill="${a.c}" ${S}/><circle cx="73" cy="31" r="11" fill="${a.c}" ${S}/><circle cx="27" cy="31" r="5.5" fill="${a.c2}"/><circle cx="73" cy="31" r="5.5" fill="${a.c2}"/>`; break;
    case 'dark': back = `<circle cx="27" cy="31" r="11" fill="${INK}" ${S}/><circle cx="73" cy="31" r="11" fill="${INK}" ${S}/>`; break;
    case 'koala': back = `<circle cx="20" cy="40" r="16" fill="${a.c}" ${S}/><circle cx="80" cy="40" r="16" fill="${a.c}" ${S}/><circle cx="21" cy="41" r="9" fill="${a.c2}"/><circle cx="79" cy="41" r="9" fill="${a.c2}"/>`; break;
    case 'small': back = `<circle cx="27" cy="34" r="7" fill="${a.c}" ${S}/><circle cx="73" cy="34" r="7" fill="${a.c}" ${S}/>`; break;
    case 'mouse': back = `<circle cx="27" cy="29" r="10" fill="${a.c}" ${S}/><circle cx="73" cy="29" r="10" fill="${a.c}" ${S}/><circle cx="27" cy="29" r="5" fill="${pink}"/><circle cx="73" cy="29" r="5" fill="${pink}"/>`; break;
    case 'floppy': back = ''; top = `<ellipse cx="21" cy="52" rx="10" ry="19" transform="rotate(18 21 52)" fill="${a.e2}" ${S}/><ellipse cx="79" cy="52" rx="10" ry="19" transform="rotate(-18 79 52)" fill="${a.e2}" ${S}/>`; break;
    case 'frog': top = `<circle cx="33" cy="31" r="12" fill="${a.c}" ${S}/><circle cx="67" cy="31" r="12" fill="${a.c}" ${S}/>`; break;
    case 'tufts': back = `<path d="M24 40 L20 14 L42 30Z" fill="${a.c}" ${S}/><path d="M76 40 L80 14 L58 30Z" fill="${a.c}" ${S}/>`; break;
    case 'pig': back = `<path d="M24 40 L25 18 L43 30Z" fill="${a.c2}" ${S}/><path d="M76 40 L75 18 L57 30Z" fill="${a.c2}" ${S}/>`; break;
    case 'tuft': top = `<path d="M50 26 C46 16 50 10 56 12 C51 14 51 19 54 24" fill="none" ${S} stroke-linecap="round"/>`; break;
    case 'spikes': {
      let pts = [];
      for (let i = 0; i <= 16; i++) { const t = Math.PI * (1.02 + i * 0.96 / 16); const r = i % 2 ? 37 : 46; pts.push(`${(50 + Math.cos(t) * r).toFixed(1)},${(58 + Math.sin(t) * r).toFixed(1)}`); }
      back = `<polygon points="${pts.join(' ')} 86,74 14,74" fill="${a.c2}" ${S}/>`; break;
    }
  }
  const head = `<ellipse cx="50" cy="57" rx="34" ry="31" fill="${a.c}" ${S}/>`;
  if (a.sloth) face += `<ellipse cx="50" cy="58" rx="27" ry="22" fill="${a.c2}"/><ellipse cx="38" cy="57" rx="10" ry="6.5" transform="rotate(18 38 57)" fill="#8E6D53"/><ellipse cx="62" cy="57" rx="10" ry="6.5" transform="rotate(-18 62 57)" fill="#8E6D53"/>`;
  if (a.penguin) face += `<path d="M50 44 C40 34 22 42 24 60 C26 76 40 82 50 82 C60 82 74 76 76 60 C78 42 60 34 50 44Z" fill="#fff"/>`;
  if (a.panda) face += `<ellipse cx="37" cy="55" rx="8" ry="10" transform="rotate(28 37 55)" fill="${INK}"/><ellipse cx="63" cy="55" rx="8" ry="10" transform="rotate(-28 63 55)" fill="${INK}"/>`;
  if (a.foxcheek) face += `<path d="M18 62 C26 60 38 64 50 72 C62 64 74 60 82 62 C80 78 66 87 50 87 C34 87 20 78 18 62Z" fill="#fff"/>`;
  if (a.pouch) face += `<ellipse cx="27" cy="68" rx="11" ry="9" fill="${a.c2}"/><ellipse cx="73" cy="68" rx="11" ry="9" fill="${a.c2}"/>`;
  if (a.muzzle) face += `<ellipse cx="50" cy="69" rx="13" ry="9.5" fill="${a.c2}"/>`;
  if (a.owl) face += `<circle cx="37" cy="55" r="12" fill="${a.c2}" ${s2}/><circle cx="63" cy="55" r="12" fill="${a.c2}" ${s2}/>`;
  if (a.frog) face += `<ellipse cx="50" cy="68" rx="22" ry="12" fill="${a.c2}"/>`;
  // eyes
  const ex = a.frog ? [33, 67] : [38, 62], ey = a.frog ? 31 : a.owl ? 55 : 56;
  const dot = (x, y, r = 4.2, col = INK, sh = '#fff') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/><circle cx="${x + 1.3}" cy="${y - 1.5}" r="${r * .34}" fill="${sh}"/>`;
  if (a.panda) eyes = dot(ex[0] + 1, ey, 3.2, '#fff', INK) + dot(ex[1] - 1, ey, 3.2, '#fff', INK);
  else if (a.sloth) eyes = dot(ex[0], 57, 3) + dot(ex[1], 57, 3);
  else if (a.owl) eyes = dot(37, 55, 5.4) + dot(63, 55, 5.4);
  else if (a.eyes === 'happy') eyes = `<path d="M33 58 Q38 51 43 58M57 58 Q62 51 67 58" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
  else if (a.eyes === 'content') eyes = `<path d="M33 55 Q38 60 43 55M57 55 Q62 60 67 55" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
  else if (a.eyes === 'sleepy') eyes = `<path d="M32 56 Q38 61 44 56M56 56 Q62 61 68 56" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`;
  else if (a.eyes === 'sparkle') eyes = dot(ex[0], ey, 5.4) + dot(ex[1], ey, 5.4) + `<circle cx="${ex[0] - 2}" cy="${ey + 2.2}" r=".9" fill="#fff"/><circle cx="${ex[1] - 2}" cy="${ey + 2.2}" r=".9" fill="#fff"/>`;
  else eyes = dot(ex[0], ey) + dot(ex[1], ey);
  if (a.brows) eyes += `<path d="M31 47 L42 50M69 47 L58 50" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`;
  // nose + mouth
  const W = `<path d="M44 69 Q47 73 50 69 Q53 73 56 69" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (a.beak === 'duck') { nose = `<ellipse cx="50" cy="67" rx="12" ry="6.5" fill="${a.c2}" ${s2}/><path d="M40 67 H60" stroke="${INK}" stroke-width="1.6"/>`; mouth = ''; }
  else if (a.beak === 'owl') { nose = `<path d="M45 63 L55 63 L50 71Z" fill="#FFB547" ${s2}/>`; mouth = ''; }
  else if (a.snout) { nose = `<ellipse cx="50" cy="66" rx="10" ry="7" fill="${a.c2}" ${s2}/><ellipse cx="46.5" cy="66" rx="1.6" ry="2.4" fill="${INK}"/><ellipse cx="53.5" cy="66" rx="1.6" ry="2.4" fill="${INK}"/>`; mouth = `<path d="M46 76 Q50 79 54 76" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`; }
  else if (a.bignose) { nose = `<ellipse cx="50" cy="64" rx="7.5" ry="9.5" fill="${INK}"/><ellipse cx="48" cy="60" rx="2" ry="3" fill="#fff" opacity=".5"/>`; mouth = `<path d="M46 77 Q50 80 54 77" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>`; }
  else if (a.frog) { nose = ''; mouth = `<path d="M33 64 Q50 78 67 64" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`; }
  else { nose = `<ellipse cx="50" cy="64.5" rx="3.6" ry="2.6" fill="${INK}"/>`; mouth = W; }
  if (a.tongue) mouth += `<path d="M47 71 Q50 79 53 71" fill="#FF8FAE" stroke="${INK}" stroke-width="1.6"/>`;
  const whisk = a.whisk ? `<path d="M22 64 L32 66M22 70 L32 69M78 64 L68 66M78 70 L68 69" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>` : '';
  const blush = a.panda || a.penguin ? `<ellipse cx="27" cy="68" rx="5.5" ry="3.2" fill="${BLUSH}" opacity=".8"/><ellipse cx="73" cy="68" rx="5.5" ry="3.2" fill="${BLUSH}" opacity=".8"/>`
    : `<ellipse cx="29" cy="66" rx="6" ry="3.5" fill="${BLUSH}" opacity=".7"/><ellipse cx="71" cy="66" rx="6" ry="3.5" fill="${BLUSH}" opacity=".7"/>`;
  return `<svg class="ani ${cls}" viewBox="0 0 100 100" aria-hidden="true">${back}${head}${top}${face}${a.frog ? '' : blush}${eyes}${nose}${mouth}${whisk}${a.frog ? blush : ''}</svg>`;
}

/* ---------- stickers (matched to things you mention) ---------- */
const K = (cx, cy, s = 1) => `<circle cx="${cx - 3.4 * s}" cy="${cy}" r="${1.3 * s}" fill="${INK}"/><circle cx="${cx + 3.4 * s}" cy="${cy}" r="${1.3 * s}" fill="${INK}"/><path d="M${cx - 1.4 * s} ${cy + 1.8 * s} Q${cx} ${cy + 3 * s} ${cx + 1.4 * s} ${cy + 1.8 * s}" fill="none" stroke="${INK}" stroke-width="${1.2 * s}" stroke-linecap="round"/><ellipse cx="${cx - 6 * s}" cy="${cy + 2 * s}" rx="${1.8 * s}" ry="${1 * s}" fill="${BLUSH}"/><ellipse cx="${cx + 6 * s}" cy="${cy + 2 * s}" rx="${1.8 * s}" ry="${1 * s}" fill="${BLUSH}"/>`;
const ST = `stroke="${INK}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"`;
const STICKERS = {
  coffee: { n: 'Coffee', kw: ['coffee', 'latte', 'espresso', 'cafe', 'café', 'cappuccino', 'flat white', 'americano', 'mocha'],
    d: `<path d="M34 22h3a5 5 0 0 1 0 10h-3" fill="none" ${ST}/><path d="M11 18h24v14a9 9 0 0 1-9 9h-6a9 9 0 0 1-9-9z" fill="#F7E3CD" ${ST}/><path d="M11 18h24" ${ST}/><path d="M18 6c-2 3 2 4 0 7M25 5c-2 3 2 4 0 7" fill="none" ${ST}/>${K(23, 28, .9)}` },
  tea: { n: 'Tea', kw: ['tea', 'matcha', 'chai', 'herbal', 'cuppa'],
    d: `<ellipse cx="24" cy="38" rx="17" ry="4.5" fill="#E6F4E1" ${ST}/><path d="M10 20h28v6a12 12 0 0 1-12 12h-4a12 12 0 0 1-12-12z" fill="#CDEBC5" ${ST}/><path d="M38 23h2a4 4 0 0 1 0 8h-3" fill="none" ${ST}/><path d="M18 20v-6" ${ST}/><rect x="15" y="9" width="6" height="6" rx="1.5" fill="#FFC95E" ${ST}/>${K(24, 27, .85)}` },
  boba: { n: 'Bubble tea', kw: ['boba', 'bubble tea', 'milkshake', 'smoothie', 'frappe', 'iced'],
    d: `<path d="M27 3l-4 13" fill="none" ${ST}/><path d="M12 15h24l-3 28H15z" fill="#F4DCF0" ${ST}/><path d="M12 15h24" ${ST}/><circle cx="19" cy="38" r="2.2" fill="${INK}"/><circle cx="25" cy="39" r="2.2" fill="${INK}"/><circle cx="29.5" cy="35" r="2.2" fill="${INK}"/><circle cx="22" cy="34" r="2.2" fill="${INK}"/>${K(24, 24, .85)}` },
  noodles: { n: 'Noodles', kw: ['noodle', 'ramen', 'pasta', 'spaghetti', 'pho', 'udon', 'soup', 'lasagne', 'lasagna', 'carbonara'],
    d: `<path d="M30 4L22 22M38 7L26 23" ${ST}/><path d="M14 22c2-6 6-6 8 0s6 6 8 0 6-6 8 0" fill="none" ${ST}/><path d="M6 22h36a18 16 0 0 1-36 0z" fill="#FFE7B8" ${ST}/>${K(24, 30, .9)}` },
  pizza: { n: 'Pizza', kw: ['pizza'],
    d: `<path d="M8 12c10-5 22-5 32 0L24 44z" fill="#FFD86E" ${ST}/><path d="M8 12c10-5 22-5 32 0l-2 5c-9-4-19-4-28 0z" fill="#F2B36B" ${ST}/><circle cx="20" cy="23" r="3" fill="#FF7E7E" ${ST}/><circle cx="28" cy="31" r="2.6" fill="#FF7E7E" ${ST}/><circle cx="27" cy="21" r="2.2" fill="#FF7E7E" ${ST}/>` },

class LocalStore {
  constructor() { this.kind = 'local'; this.mem = { meta: null, entries: new Map(), media: new Map(), reports: new Map() }; this.dbp = null; }
  open() {
    if (this.dbp) return this.dbp;
    this.dbp = new Promise(res => {
      try {
        const r = indexedDB.open('mochi-diary', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('entries', { keyPath: 'id' }); d.createObjectStore('media'); d.createObjectStore('reports', { keyPath: 'id' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      } catch { res(null); }
      setTimeout(() => res(null), 3000);
    });
    return this.dbp;
  }
  req(d, store, mode, fn) {
    return new Promise((res, rej) => {
      try { const t = d.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }
      catch (e) { rej(e); }
    });
  }
  async init() {
    const d = await this.open();
    if (!d) return { meta: clone(this.mem.meta), entries: [...this.mem.entries.values()].map(clone), reports: [...this.mem.reports.values()].map(clone) };
    const meta = await this.req(d, 'kv', 'readonly', s => s.get('meta'));
    const entries = await this.req(d, 'entries', 'readonly', s => s.getAll());
    const reports = await this.req(d, 'reports', 'readonly', s => s.getAll());
    return { meta: meta || null, entries: entries || [], reports: reports || [] };
  }
  async putMeta(m) { const d = await this.open(); if (!d) { this.mem.meta = clone(m); return; } await this.req(d, 'kv', 'readwrite', s => s.put(clone(m), 'meta')); }
  async putEntry(e) { const d = await this.open(); if (!d) { this.mem.entries.set(e.id, clone(e)); return; } await this.req(d, 'entries', 'readwrite', s => s.put(clone(e))); }
  async delEntry(id) { const d = await this.open(); if (!d) { this.mem.entries.delete(id); return; } await this.req(d, 'entries', 'readwrite', s => s.delete(id)); }
  async putReport(r) { const d = await this.open(); if (!d) { this.mem.reports.set(r.id, clone(r)); return; } await this.req(d, 'reports', 'readwrite', s => s.put(clone(r))); }
  async delReport(id) { const d = await this.open(); if (!d) { this.mem.reports.delete(id); return; } await this.req(d, 'reports', 'readwrite', s => s.delete(id)); }
  async putMedia(id, url) { const d = await this.open(); if (!d) { this.mem.media.set(id, url); return 1; } await this.req(d, 'media', 'readwrite', s => s.put(url, id)); return 1; }
  async getMedia(id) { const d = await this.open(); if (!d) return this.mem.media.get(id) || null; return (await this.req(d, 'media', 'readonly', s => s.get(id))) || null; }
  async delMedia(id) { const d = await this.open(); if (!d) { this.mem.media.delete(id); return; } await this.req(d, 'media', 'readwrite', s => s.delete(id)); }
  async clearAll() {
    const d = await this.open();
    if (!d) { this.mem.entries.clear(); this.mem.media.clear(); this.mem.reports.clear(); return; }
    for (const st of ['entries', 'media', 'reports']) await this.req(d, st, 'readwrite', s => s.clear());
  }
}

class CloudStore {
  constructor(db, userId) {
    this.kind = 'cloud';
    this.root = db.doc(`data/users/${userId}/mochi`);
    this.ent = this.root.collection('entries');
    this.med = this.root.collection('media');
    this.rep = this.root.collection('reports');
    this.q = new Map();
  }
  serial(key, fn) {
    const prev = this.q.get(key) || Promise.resolve();
    const p = prev.catch(() => {}).then(fn);
    this.q.set(key, p);
    p.catch(() => {}).finally(() => { if (this.q.get(key) === p) this.q.delete(key); });
    return p;
  }
  retry(fn) { return fn().catch(e => { if (e && e.code === 'unavailable') return sleep(400 + Math.random() * 700).then(fn); throw e; }); }
  async init() {
    const [m, q, r] = await Promise.all([this.retry(() => this.root.get()), this.retry(() => this.ent.limit(1000).get()), this.retry(() => this.rep.limit(50).get())]);
    return { meta: m.exists ? clone(m.data()) : null, entries: q.docs.map(d => clone(d.data())), reports: r.docs.map(d => clone(d.data())) };
  }
  putMeta(m) { const c = clone(m); return this.serial('meta', () => this.retry(() => this.root.set(c))); }
  putEntry(e) { const c = clone(e); return this.serial(e.id, () => this.retry(() => this.ent.doc(e.id).set(c))); }
  delEntry(id) { return this.serial(id, () => this.retry(() => this.ent.doc(id).delete())); }
  putReport(r) { const c = clone(r); return this.serial('r:' + r.id, () => this.retry(() => this.rep.doc(r.id).set(c))); }
  delReport(id) { return this.serial('r:' + id, () => this.retry(() => this.rep.doc(id).delete())); }
  async putMedia(id, url) {
    const parts = chunk(url, CHUNK);
    for (let i = 0; i < parts.length; i++) { const body = { d: parts[i], n: parts.length }; await this.retry(() => this.med.doc(`${id}~${i}`).set(body)); }
    return parts.length;
  }
  async getMedia(id) {
    const f = await this.retry(() => this.med.doc(`${id}~0`).get());
    if (!f.exists) return null;
    const n = f.data().n || 1;
    const rest = await Promise.all(Array.from({ length: n - 1 }, (_, i) => this.retry(() => this.med.doc(`${id}~${i + 1}`).get())));
    return [f, ...rest].map(s => s.exists ? s.data().d : '').join('');
  }
  async delMedia(id, n = 1) { for (let i = 0; i < Math.max(1, n); i++) await this.retry(() => this.med.doc(`${id}~${i}`).delete()); }
  async clearAll() {
    const [q, r] = await Promise.all([this.ent.limit(1000).get(), this.rep.limit(50).get()]);
    for (const d of q.docs) { const e = d.data(); if (e && e.photo && e.photo.id) await this.delMedia(e.photo.id, e.photo.n).catch(() => {}); await this.ent.doc(d.id).delete(); }
    for (const d of r.docs) await this.rep.doc(d.id).delete();
  }
  subscribe(onEntries, onMeta) {
    try {
      this.u1 = this.ent.limit(1000).onSnapshot(s => onEntries(s.docs.map(d => clone(d.data())), s.metadata), () => {});
      this.u2 = this.root.onSnapshot(s => { if (s.exists) onMeta(clone(s.data()), s.metadata); }, () => {});
    } catch {}
  }
  unsubscribe() { try { this.u1 && this.u1(); this.u2 && this.u2(); } catch {} }
}

  let n = 0; const hits = [];

function findPeople(text) {
  const out = new Set();
  const sentences = String(text).split(/(?<=[.!?\n])\s+/);
  for (const s of sentences) {
    const toks = s.match(/[A-Z][a-z]{1,15}(?:'s)?/g) || [];
    toks.forEach((w, i) => {
      w = w.replace(/'s$/, '');
      if (NOT_NAMES.has(w)) return;
      if (i === 0 && s.trim().startsWith(w)) return;
      out.add(w);

function dayData() {

function normCards(r) {
  const list = Array.isArray(r) ? r : r && Array.isArray(r.cards) ? r.cards : [];
  const str = (v, n) => typeof v === 'string' ? v.trim().slice(0, n) : '';
  return list.map(c => ({ type: CARD_TYPES[c && c.type] ? c.type : 'perspective', title: str(c && c.title, 90), body: str(c && c.body, 600), why: str(c && c.why, 240), vote: 0 }))

function quickCards(dm) {
  const days = [...dm.values()].sort((a, b) => a.day.localeCompare(b.day));
  const out = [];
  if (!days.length) return out;
  const mAvg = k => avg(days.map(d => d.scores[k]));
  // aha: something that comes with higher joy
  if (days.length >= 4) {
    const tags = new Map();
    for (const d of days) for (const t of [...d.areas.map(a => 'a:' + a), ...d.people.map(p => 'p:' + p), ...d.stickers.map(s => 's:' + s)]) tags.set(t, (tags.get(t) || 0) + 1);
    let best = null;
    for (const [t, n] of tags) {
      if (n < 2 || n > days.length - 2) continue;
      const has = d => (t[0] === 'a' ? d.areas : t[0] === 'p' ? d.people : d.stickers).includes(t.slice(2));
      const w = avg(days.filter(has).map(d => d.scores.joy)), wo = avg(days.filter(d => !has(d)).map(d => d.scores.joy));
      if (w - wo > 0.8 && (!best || w - wo > best.diff)) best = { t, n, w, wo, diff: w - wo };
    }
    if (best) {
      const nm = best.t[0] === 'a' ? AREAS[best.t.slice(2)].toLowerCase() : best.t[0] === 'p' ? best.t.slice(2) : STICKERS[best.t.slice(2)].n.toLowerCase();
      out.push({ type: 'aha', title: `Joy runs higher with ${nm}`, body: `On the ${best.n} days that involved ${nm}, your joy averaged ${r1(best.w)} out of 10, compared with ${r1(best.wo)} on the other days. That's a lift worth planning for.`, why: 'Noticing what reliably lifts you makes it easier to choose it on purpose (savoring).', vote: 0 });
    }

    const last = days.slice(-3), before = days.slice(0, -3);

    const de = avg(last.map(d => d.scores.energy)) - avg(before.map(d => d.scores.energy));
    if (ds >= 1) out.push({ type: 'heads-up', title: 'Stress has been creeping up', body: `Your last three days averaged ${r1(avg(last.map(d => d.scores.stress)))} for stress, up from ${r1(avg(before.map(d => d.scores.stress)))} before. Worth noticing before it becomes the new normal.`, why: 'Catching stress early is easier than recovering from a long stretch of it.', vote: 0 });
    else if (de <= -1) out.push({ type: 'heads-up', title: 'Your battery is running low', body: `Energy over your last three days averaged ${r1(avg(last.map(d => d.scores.energy)))}, down from ${r1(avg(before.map(d => d.scores.energy)))}. A slower evening might pay off.`, why: 'Sleep and rest shape mood more than most of us expect (sleep and mood).', vote: 0 });
  }
  // belief: your best lift
  const lifts = aggFactors(days).filter(f => f.area === 'joy' && f.sum > 0).sort((a, b) => b.sum - a.sum);
  if (lifts[0]) out.push({ type: 'belief', title: 'You know how to make a good day', body: `"${lifts[0].label}" gave your joy one of its biggest lifts. You made that happen, and you can do it again.`, why: 'Remembering your own wins builds a steadier sense of what you can do (self-efficacy).', vote: 0 });
  // perspective: the lowest area
  const lows = { social: ['A small hello counts', 'Social time has been light lately. A two-minute message to someone you like counts more than you think.', 'Even brief, small moments of connection lift mood (social connection).'],
    energy: ['Rest is part of the plan', "Your energy has been on the low side. Rest isn't a reward for finishing; it's what lets you keep going.", 'Recovery time protects energy and mood (sleep and mood).'],
    joy: ['Look for one good thing', "Joy has been quieter lately. Tonight, write down one small thing that went right, however tiny.", 'Paying attention to small good moments makes them last longer (savoring).'],
    productivity: ['Make the next step tiny', "Focus has been hard to find. Pick a step so small it feels silly, and let that count as progress.", 'Small wins build momentum and motivation (the progress principle).'],
    stress: ['Name it to tame it', 'Stress has been high. Writing down exactly what is worrying you can shrink it, even before you fix anything.', 'Putting feelings into words can calm them (affect labelling).'] };
  const lowest = mAvg('stress') >= 6 ? 'stress' : ['social', 'energy', 'joy', 'productivity'].sort((a, b) => mAvg(a) - mAvg(b))[0];
  const L = lows[lowest];
  out.push({ type: 'perspective', title: L[0], body: L[1], why: L[2], vote: 0 });
  return out.slice(0, 4);
}

/* ---------- charts ---------- */
function smoothPath(pts) {

  }
  return d;
}
function lineChart(keys, val, metric, { h = 160, hi = null, label = '' } = {}) {

  const step = Math.max(1, Math.ceil(n / 6));

  const line = smoothPath(pts);
  const area = pts.length > 1 ? `${line} L${pts[pts.length - 1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)}Z` : '';
  const dots = pts.map(p => { const big = hi && hi.has(p[2]); return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${big ? 6 : 4}" fill="${big ? col : 'var(--card)'}" stroke="${col}" stroke-width="2.5"/>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${area ? `<path d="${area}" fill="${col}" opacity=".18"/>` : ''}<path d="${line}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"/>${dots}</svg>`;
}

function radar(vals) {

const DIVE_ACTS = {

function quickReport(dive, dm) {
  const days = [...dm.values()].sort((a, b) => a.day.localeCompare(b.day));
  const m = dive.metric, inv = m === 'stress';
  const rel = dive.areas ? days.filter(d => d.areas.some(a => dive.areas.includes(a))) : days;
  const base = rel.length >= 2 ? rel : days;
  const a = avg(base.map(d => d.scores[m]));
  const best = base.slice().sort((x, y) => inv ? x.scores[m] - y.scores[m] : y.scores[m] - x.scores[m])[0];
  const worst = base.slice().sort((x, y) => inv ? y.scores[m] - x.scores[m] : x.scores[m] - y.scores[m])[0];
  const facs = aggFactors(base, m);

  const weighs = facs.filter(f => inv ? f.sum > 0 : f.sum < 0).sort((x, y) => Math.abs(y.sum) - Math.abs(x.sum)).slice(0, 4).map(f => f.label);

    headline: `Your ${dive.name.toLowerCase()} at a glance`,
    summary: `Across ${base.length} day${base.length === 1 ? '' : 's'}${dive.areas && rel.length >= 2 ? ` where ${dive.name.toLowerCase()} came up` : ''}, your ${nm} averaged ${r1(a)} out of 10.${lifts.length ? ` It tended to ${inv ? 'ease' : 'rise'} with ${listJoin(lifts.slice(0, 2).map(s => s.toLowerCase()))}.` : ''}${weighs.length ? ` It ${inv ? 'climbed' : 'dipped'} with ${listJoin(weighs.slice(0, 2).map(s => s.toLowerCase()))}.` : ''}\n\nThis is a quick report made on this device. Inside Claude, Mochi reads your full entries and writes a deeper one.`,

    lifts, weighs,

    patterns: patterns.slice(0, 3).map(({ diff, ...p }) => p),

}
async function writeReport(id, force) {

  const dm = dayData(); const n = dm.size;

    const r = { id, at: Date.now(), count: n, src, data };
    S.reports[id] = r; await S.store.putReport(r).catch(saveErr);
  };
  if (!aiOK()) { await save(quickReport(dive, dm), 'quick'); refreshDive(id); render(); return; }
  S.repBusy[id] = true; S.repCtl[id] = new AbortController(); refreshDive(id); render();
  const lines = days.map(d => `${d.day}: joy ${d.scores.joy}, stress ${d.scores.stress}, social ${d.scores.social}, productivity ${d.scores.productivity}, energy ${d.scores.energy}; areas ${d.areas.join('/') || '-'}; people ${d.people.join('/') || '-'}; factors: ${d.factors.map(f => `${f.label} (${f.area} ${f.effect > 0 ? '+' : ''}${f.effect})`).join(', ') || '-'}; ${clip(d.list.map(e => e.ai.snapshot).join(' '), 300)}`);

    if (force) opts.cache = false;
    const r = normReport(await AI.s.json(reportPrompt(dive, lines, S.meta, n), opts));
    if (!r.summary) throw { code: 'invalid_json' };
    await save(r, 'claude');
  } catch (e) {
    const code = aiFail(e);
    if (code !== 'cancelled') { toast(aiMsg(code)); if (!S.reports[id]) await save(quickReport(dive, dm), 'quick'); }
  }
  S.repBusy[id] = false; S.repCtl[id] = null;
  refreshDive(id); render();
}

    if (d.stats.length) h += `<div class="stats">${d.stats.map(s => `<div class="stat"><small>${esc(s.label)}</small><b>${esc(s.value)}</b></div>`).join('')}</div>`;
  } else if (S.repTab === 'act') {
    h += `<section class="card"><div class="lists"><div><h4>Lifts you</h4>${d.lifts.length ? `<ul class="ul up">${d.lifts.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<span class="small muted">Nothing clear yet</span>'}</div><div><h4>Weighs on you</h4>${d.weighs.length ? `<ul class="ul dn">${d.weighs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<span class="small muted">Nothing clear yet</span>'}</div></div></section>`;
    h += `<div class="sec-h"><h2>Try this</h2></div>${d.actions.map((a, i) => `<button class="act" data-act="tick" data-id="${id}" data-i="${i}" aria-pressed="${!!acts[i]}"><span class="bx">${ic('check')}</span><span><b>${esc(a.title)}</b><span>${esc(a.detail)}</span></span></button>`).join('')}`;
  } else if (S.repTab === 'patterns') {
    h += d.patterns.length ? `<section class="card">${d.patterns.map(p => `<div class="pat"><b>${esc(p.title)}</b><span>${esc(p.detail)}</span>${p.dates.length ? `<div class="chips">${p.dates.map(x => dm.get(x) ? `<button class="chip acc" data-act="open-entry" data-id="${dm.get(x).last.id}">${esc(fmtShort(x))}</button>` : `<span class="chip">${esc(fmtShort(x))}</span>`).join('')}</div>` : ''}</div>`).join('')}</section>`
      : `<div class="empty"><p>No clear patterns yet. They show up as you add more days.</p></div>`;
  } else {
    const days = [...dm.values()].sort((a, b) => a.day.localeCompare(b.day)).slice(-60);
    const keys = []; if (days.length) { for (let k = days[0].day; k <= dayKey(); k = addDays(k, 1)) keys.push(k); }
    const val = {}; days.forEach(x => { val[x.day] = x.scores[dive.metric]; });
    const hi = dive.areas ? new Set(days.filter(x => x.areas.some(a => dive.areas.includes(a))).map(x => x.day)) : null;
    h += `<section class="card m-${dive.metric}"><div class="card-h"><h2>${MNAME[dive.metric]} over time</h2></div>${lineChart(keys.slice(-60), val, dive.metric, { label: MNAME[dive.metric] + ' over time', hi })}${hi ? `<span class="small muted">Big dots are days where ${esc(dive.name.toLowerCase())} came up.</span>` : ''}</section>`;
    if (d.moments.length) h += `<section class="card"><div class="card-h"><h2>Key moments</h2></div>${d.moments.map(m => `<div class="moment"><span class="dt">${esc(fmtShort(m.date))}</span><span>${esc(m.note)}</span></div>`).join('')}</section>`;
    const facs = aggFactors(days, dive.metric).sort((a, b) => Math.abs(b.sum) - Math.abs(a.sum)).slice(0, 6);
    if (facs.length) h += `<section class="card"><div class="card-h"><h2>Biggest factors</h2></div><div class="factors">${facs.map(f => facRow({ area: f.area, label: f.label + (f.n > 1 ? ` ×${f.n}` : ''), effect: clamp(Math.round(f.sum), -9, 9) || (f.sum > 0 ? 1 : -1) })).join('')}</div></section>`;
  }
  h += `<div style="display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:0 4px"><span class="small muted">${r.src === 'quick' ? 'Quick report made on this device' : 'Written by Mochi'} · ${esc(new Date(r.at).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }))} · ${r.count} days</span>${n >= DIVE_MIN ? `<button class="btn sm sec" data-act="write-dive" data-id="${id}" data-force="1">${ic('refresh')}${r.count < n ? `Update with ${n - r.count} new day${n - r.count > 1 ? 's' : ''}` : 'Rewrite'}</button>` : ''}</div>`;
  b.innerHTML = h;
}

function keypadHTML() {

function pinView(title, err = '') {
  return `<div class="pin-wrap">${mochiSVG(err ? 'sad' : PIN.mode === 'unlock' ? 'sleepy' : 'idle')}<p class="pin-t">${esc(title)}</p><div class="pin-dots" aria-label="${PIN.buf.length} of 4 digits">${[0, 1, 2, 3].map(i => `<i class="${i < PIN.buf.length ? 'on' : ''}"></i>`).join('')}</div><p class="pin-err" role="alert">${esc(err)}</p>${keypadHTML()}${PIN.mode === 'unlock' ? `<button class="btn ghost sm" data-act="pin-forgot">Forgot passcode?</button>` : ''}</div>`;
}
function showLock() {
  if (!S.meta.pinHash) return;
  PIN = { buf: '', mode: 'unlock', first: '' };
  const l = $('#lock'); l.hidden = false; l.innerHTML = pinView('Welcome back! Enter your passcode');
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
}
function openPinSetup() {
  PIN = { buf: '', mode: 'set', first: '' };
  openLayer(sheetHTML(`${xBtn()}<span class="t">Passcode</span><span style="width:44px"></span>`, `<div id="pin-host" style="padding-top:12px">${pinView('Choose a 4-digit passcode')}</div>`, '', 'half'), { id: 'pin' });
}
async function pinPress(d) {
  if (d === 'x') PIN.buf = PIN.buf.slice(0, -1); else if (PIN.buf.length < 4) PIN.buf += d;
  const host = PIN.mode === 'unlock' ? $('#lock') : $('#pin-host');
  if (!host) return;
  const title = PIN.mode === 'unlock' ? 'Welcome back! Enter your passcode' : PIN.mode === 'set' ? 'Choose a 4-digit passcode' : 'Type it once more';
  host.innerHTML = pinView(title);
  if (PIN.buf.length < 4) return;
  const code = PIN.buf;
  await sleep(120);
  if (PIN.mode === 'unlock') {
    if (await hashPin(code) === S.meta.pinHash) { $('#lock').hidden = true; $('#lock').innerHTML = ''; S.hidden = 0; }
    else { PIN.buf = ''; host.innerHTML = pinView('Welcome back! Enter your passcode', "That's not it. Try again."); $('.pin-dots', host).classList.add('shake'); }
  } else if (PIN.mode === 'set') { PIN.first = code; PIN.buf = ''; PIN.mode = 'confirm'; host.innerHTML = pinView('Type it once more'); }
  else {
    if (code === PIN.first) {
      S.meta.pinHash = await hashPin(code); persistMeta();
      closeLayer(layerById('pin')); refreshYou(); toast('Passcode on. Mochi will keep your diary safe.');
    } else { PIN = { buf: '', mode: 'set', first: '' }; host.innerHTML = pinView('Choose a 4-digit passcode', "Those didn't match. Start again."); }
  }
}

/* ================= import / export ================= */
async function saveFile(filename, data, mime) {
  if (TAURI) {
    try { const name = await TAURI.core.invoke('save_export', { filename, contents: String(data) }); if (name) toast('Saved ' + name); }
    catch (e) { console.warn('Mochi: export failed', e); toast("Couldn't save the file."); }
    return;
  }
  if (DL) {
    try { const r = await DL.save({ filename, data }); if (r && r.status === 'saved') toast('Saved ' + filename); return; }
    catch (e) { if (e && e.code === 'cancelled') return; if (e && e.code !== 'unavailable') { toast("Couldn't save the file."); return; } }
  }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: mime })); a.download = filename;
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch { toast("This view can't save files."); }
}
async function exportJSON() {
  toast('Packing up your diary…');
  const media = {};
  for (const e of S.entries) if (e.photo && e.photo.id) { try { const u = await S.store.getMedia(e.photo.id); if (u) media[e.photo.id] = u; } catch {} }
  const meta = clone(S.meta); delete meta.pinHash;
  const data = JSON.stringify({ app: 'mochi-diary', v: 1, exported: new Date().toISOString(), meta, entries: S.entries.filter(e => !e.example), reports: Object.values(S.reports), media });
  await saveFile(`mochi-diary-${dayKey()}.json`, data, 'application/json');
}
async function exportMD() {
  const out = [`# Mochi Diary${S.meta.name ? ' · ' + S.meta.name : ''}`, `Exported ${fmtDay(dayKey(), { day: 'numeric', month: 'long', year: 'numeric' })}`, ''];
  for (const e of S.entries.filter(x => !x.example)) {
    const a = e.ai;
    out.push(`## ${fmtDay(e.day, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}${a ? ' · ' + a.title : ''}`, '');
    if (a) {
      out.push(a.snapshot, '', `Joy ${a.scores.joy} · Stress ${a.scores.stress} · Social ${a.scores.social} · Focus ${a.scores.productivity} · Energy ${a.scores.energy} · ${ANIMALS[a.animal].name} energy`, '');
      if (a.reply) out.push(`> Mochi: ${a.reply}`, '');
    }
    out.push('**What I wrote**', '', e.text, '');
  }
  await saveFile(`mochi-diary-${dayKey()}.md`, out.join('\n'), 'text/markdown');
}
async function importJSON(file) {
  let d; try { d = JSON.parse(await file.text()); } catch { toast("That file isn't a Mochi Diary backup."); return; }
  if (!d || d.app !== 'mochi-diary' || !Array.isArray(d.entries)) { toast("That file isn't a Mochi Diary backup."); return; }
  let added = 0;
  for (const raw of d.entries) {
    const e = sanitizeEntry(raw); if (!e) continue;
    const cur = byId(e.id);
    if (cur && (cur.updated || 0) >= (e.updated || 0)) continue;
    if (e.photo && d.media && d.media[e.photo.id]) { try { e.photo.n = await S.store.putMedia(e.photo.id, d.media[e.photo.id]); } catch {} }
    if (e.status === 'reading') e.status = 'pending';
    if (cur) Object.assign(cur, e); else S.entries.push(e);
    await S.store.putEntry(e).catch(saveErr); added++;
  }
  for (const r of Array.isArray(d.reports) ? d.reports : []) if (r && DIVES.some(x => x.id === r.id) && r.data && (!S.reports[r.id] || S.reports[r.id].at < r.at)) { S.reports[r.id] = r; S.store.putReport(r).catch(() => {}); }
  if (d.meta && !S.meta.name && d.meta.name) { S.meta.name = String(d.meta.name).slice(0, 40); S.meta.notes = S.meta.notes || String(d.meta.notes || '').slice(0, 3000); persistMeta(); }
  sortEntries(); render(); refreshYou();
  toast(added ? `Restored ${added} day${added > 1 ? 's' : ''}.` : 'Nothing new in that backup.');
}
async function eraseAll() {
  const ok = await confirmBox({ title: 'Erase your whole diary?', text: 'All your days, photos, reports and settings will be deleted. This cannot be undone.', ok: 'Erase', danger: true, expr: 'sad' });
  if (!ok) return;
  await S.store.clearAll().catch(saveErr);
  S.entries = []; S.reports = {}; S.cardsTried = {};
  S.meta = normalizeMeta({ flavor: S.meta.flavor, theme: S.meta.theme });
  await persistMeta(); LS.del('draft'); applyLook();
  closeLayer(layerById('you')); render(); toast('Your diary is empty again.');
  openWelcome();
}

function render() {
  const v = $('#view'); if (!v || !S.meta) return;
  const html = S.tab === 'cards' ? vCards() : S.tab === 'trends' ? vTrends() : S.tab === 'dives' ? vDives() : vDiary();
  v.innerHTML = html;
